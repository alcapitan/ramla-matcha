<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>Ramla رملة Matcha — Ceremonial matcha, Algeria</title>
        <meta
            name="description"
            content="Ramla رملة — ceremonial grade matcha in a stainless steel tin, lab-tested in Europe. Delivered in all 58 wilayas, cash on delivery."
        />
        <meta name="theme-color" content="#EFE9DD" />
        <meta property="og:title" content="Ramla رملة Matcha" />
        <meta
            property="og:description"
            content="Ceremonial matcha with the soul of the desert. Delivered in 58 wilayas."
        />
        <meta property="og:image" content="/img/hero.webp" />
        <link rel="icon" href="/img/logo.png" type="image/png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Courier+Prime&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,100;1,9..144,300..600,100&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap"
        />
        <link rel="stylesheet" href="/css/style.css" />
    </head>
    <body data-page="home">
        <div id="site-header"></div>

        <main>
            <section class="hero">
                <div class="hero-text">
                    <span
                        class="eyebrow reveal"
                        data-i18n="hero.eyebrow"
                    ></span>
                    <h1 class="reveal">
                        <span class="ar-line">رملة</span
                        ><span data-i18n="hero.title"></span>
                    </h1>
                    <p class="lead reveal" data-i18n="hero.lead"></p>
                    <div class="hero-cta reveal">
                        <a class="btn" href="/shop" data-i18n="hero.cta"></a>
                        <a
                            class="link-arrow"
                            href="/story"
                            data-i18n="hero.cta2"
                        ></a>
                    </div>
                </div>
                <div class="hero-media">
                    <img
                        src="/img/hero.webp"
                        alt="Ramla Matcha tins"
                        fetchpriority="high"
                    />
                    <div class="hero-badge">
                        <span class="dot"></span
                        ><span data-i18n="hero.badge"></span>
                    </div>
                </div>
            </section>

            <div class="marquee" aria-hidden="true">
                <div class="marquee-track" id="marquee"></div>
            </div>

            <section class="section">
                <div class="wrap split">
                    <div class="frame ratio-45 reveal">
                        <img
                            src="/img/tin-dark.webp"
                            alt="Ramla Matcha 30g tin"
                            loading="lazy"
                        />
                    </div>
                    <div>
                        <span
                            class="eyebrow reveal"
                            data-i18n="feat.eyebrow"
                        ></span>
                        <h2 class="reveal" data-i18n="feat.title"></h2>
                        <p
                            class="muted reveal"
                            style="margin-top: 20px"
                            data-i18n="feat.text"
                        ></p>
                        <div class="stat-row reveal">
                            <div>
                                <b>30 g</b><span data-i18n="feat.stat2"></span>
                            </div>
                            <div>
                                <b>~10</b><span data-i18n="feat.stat1"></span>
                            </div>
                            <div>
                                <b>58</b><span data-i18n="feat.stat3"></span>
                            </div>
                        </div>
                        <div class="hero-cta reveal" style="margin-top: 34px">
                            <a
                                class="btn"
                                href="/shop"
                                data-i18n="feat.cta"
                            ></a>
                            <span class="price" data-price="matcha-30g"></span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="section" style="padding-top: 0">
                <div class="wrap mosaic">
                    <div class="frame m1 reveal">
                        <img
                            src="/img/model-stairs.webp"
                            alt=""
                            loading="lazy"
                        />
                    </div>
                    <div class="frame m2 reveal">
                        <img
                            src="/img/matcha-iced.webp"
                            alt=""
                            loading="lazy"
                        />
                    </div>
                    <div class="frame m3 reveal">
                        <img src="/img/tins-stone.jpg" alt="" loading="lazy" />
                    </div>
                    <div class="frame m4 reveal">
                        <img
                            src="/img/tins-magazines.webp"
                            alt=""
                            loading="lazy"
                            style="object-position: 50% 40%"
                        />
                    </div>
                </div>
            </section>

            <section class="section" style="background: var(--ivory)">
                <div class="wrap">
                    <div
                        class="center"
                        style="max-width: 720px; margin: 0 auto 56px"
                    >
                        <span
                            class="eyebrow reveal"
                            data-i18n="ritual.eyebrow"
                        ></span>
                        <h2 class="reveal" data-i18n="ritual.title"></h2>
                    </div>
                    <ol class="ritual-steps" style="padding: 0; margin: 0">
                        <li class="reveal" style="background: var(--cream)">
                            <h3 data-i18n="ritual.s1.t"></h3>
                            <p data-i18n="ritual.s1.p"></p>
                        </li>
                        <li class="reveal" style="background: var(--cream)">
                            <h3 data-i18n="ritual.s2.t"></h3>
                            <p data-i18n="ritual.s2.p"></p>
                        </li>
                        <li class="reveal" style="background: var(--cream)">
                            <h3 data-i18n="ritual.s3.t"></h3>
                            <p data-i18n="ritual.s3.p"></p>
                        </li>
                    </ol>
                </div>
            </section>

            <section class="section">
                <div class="wrap split reverse">
                    <div class="frame ratio-45 reveal">
                        <img
                            src="/img/street.webp"
                            alt="Ramla Matcha in front of the Grande Poste d'Alger"
                            loading="lazy"
                        />
                    </div>
                    <div>
                        <span
                            class="eyebrow reveal"
                            data-i18n="storyteaser.eyebrow"
                        ></span>
                        <h2 class="reveal" data-i18n="storyteaser.title"></h2>
                        <p
                            class="muted reveal"
                            style="margin: 20px 0 30px"
                            data-i18n="storyteaser.text"
                        ></p>
                        <a
                            class="btn ghost reveal"
                            href="/story"
                            data-i18n="storyteaser.cta"
                        ></a>
                    </div>
                </div>
            </section>

            <section class="section" style="padding-top: 0">
                <div class="wrap">
                    <div
                        style="
                            display: flex;
                            justify-content: space-between;
                            align-items: flex-end;
                            gap: 20px;
                            flex-wrap: wrap;
                            margin-bottom: 40px;
                        "
                    >
                        <div>
                            <span
                                class="eyebrow reveal"
                                data-i18n="acc.eyebrow"
                            ></span>
                            <h2 class="reveal" data-i18n="acc.title"></h2>
                        </div>
                        <a
                            class="link-arrow reveal"
                            href="/accessories"
                            data-i18n="acc.cta"
                        ></a>
                    </div>
                    <div class="products" id="home-products"></div>
                </div>
            </section>

            <section
                class="section"
                style="
                    background: var(--deep);
                    color: var(--on-dark);
                    text-align: center;
                "
            >
                <div class="wrap">
                    <h2 class="reveal" data-i18n="insta.title"></h2>
                    <p
                        class="reveal"
                        style="opacity: 0.8; margin: 14px 0 30px"
                        data-i18n="insta.text"
                    ></p>
                    <a
                        class="btn light reveal"
                        href="https://instagram.com/ramla.matchadz"
                        target="_blank"
                        rel="noopener"
                        >@ramla.matchadz</a
                    >
                </div>
            </section>
        </main>

        <div id="site-footer"></div>

        <script src="/js/i18n.js"></script>
        <script src="/js/app.js"></script>
        <script>
            (function () {
                const R = window.Ramla;
                function marquee() {
                    const items = [1, 3, 4, 5]
                        .map((i) => `<span>${R.t("marquee." + i)}</span>`)
                        .join("");
                    document.getElementById("marquee").innerHTML =
                        items + items + items + items;
                }
                async function products() {
                    const shop = await R.shop();
                    document.getElementById("home-products").innerHTML =
                        shop.products
                            .filter((p) => p.id !== "matcha-30g")
                            .map(R.productCard)
                            .join("");
                    R.refreshProductNames();
                    R.observe();
                }
                marquee();
                products().catch(console.error);
                R.refreshProductNames().catch(() => {});
                document.addEventListener("langchange", () => {
                    marquee();
                    products();
                });
            })();
        </script>
    </body>
</html>
