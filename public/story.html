<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>Our Story — Ramla رملة Matcha</title>
        <meta
            name="description"
            content="Ramla means sand in Arabic. The story of an Algerian matcha brand built on the desert and on our culture."
        />
        <meta name="theme-color" content="#EFE9DD" />
        <meta property="og:image" content="/img/street.webp" />
        <link rel="icon" href="/img/logo.png" type="image/png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Courier+Prime&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,100;1,9..144,300..600,100&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap"
        />
        <link rel="stylesheet" href="/css/style.css" />
    </head>
    <body data-page="story">
        <div id="site-header"></div>

        <main>
            <section class="story-hero">
                <img
                    src="/img/stairs-wide.webp"
                    alt="Stone stairs and Ramla Matcha tins"
                    fetchpriority="high"
                />
                <div class="caption">
                    <span class="eyebrow" data-i18n="story.eyebrow"></span>
                    <h1 data-i18n="story.title"></h1>
                </div>
            </section>

            <section class="section">
                <div class="wrap">
                    <div class="prose">
                        <p class="dropcap reveal" data-i18n="story.p1"></p>
                        <p class="reveal" data-i18n="story.p2"></p>
                    </div>
                </div>
            </section>

            <section class="section" style="padding-top: 0">
                <div class="wrap split">
                    <div class="frame ratio-45 reveal">
                        <img src="/img/wall.webp" alt="" loading="lazy" />
                    </div>
                    <div class="frame ratio-45 reveal">
                        <img src="/img/model-walk.webp" alt="" loading="lazy" />
                    </div>
                </div>
            </section>

            <section class="section" style="background: var(--ivory)">
                <div class="wrap split">
                    <div class="frame ratio-45 reveal">
                        <img src="/img/photo.webp" alt="" loading="lazy" />
                    </div>
                    <div>
                        <span class="eyebrow reveal">01</span>
                        <h2 class="reveal" data-i18n="story.tin.t"></h2>
                        <p
                            class="muted reveal"
                            style="margin-top: 20px; font-size: 1.08rem"
                            data-i18n="story.tin.p"
                        ></p>
                    </div>
                </div>
            </section>

            <section class="section">
                <div class="wrap split reverse">
                    <div class="frame ratio-45 reveal">
                        <img src="/img/bench.webp" alt="" loading="lazy" />
                    </div>
                    <div>
                        <span class="eyebrow reveal">02</span>
                        <h2 class="reveal" data-i18n="story.name.t"></h2>
                        <p
                            class="muted reveal"
                            style="margin-top: 20px; font-size: 1.08rem"
                            data-i18n="story.name.p"
                        ></p>
                    </div>
                </div>
            </section>

            <section class="section" style="padding-top: 0">
                <div class="wrap">
                    <h2
                        class="reveal center"
                        style="margin-bottom: 34px"
                        data-i18n="story.promise.t"
                    ></h2>
                    <ol
                        class="ritual-steps"
                        style="
                            padding: 0;
                            margin: 0;
                            grid-template-columns: repeat(
                                auto-fit,
                                minmax(260px, 1fr)
                            );
                            max-width: 860px;
                            margin-inline: auto;
                        "
                    >
                        <li class="reveal">
                            <p
                                style="
                                    color: var(--ink);
                                    font-weight: bold;
                                    font-size: 1.2rem;
                                "
                                data-i18n="story.promise.1.t"
                            ></p>
                            <p
                                style="color: var(--ink); font-size: 1.08rem"
                                data-i18n="story.promise.1"
                            ></p>
                        </li>
                        <li class="reveal">
                            <p
                                style="
                                    color: var(--ink);
                                    font-weight: bold;
                                    font-size: 1.2rem;
                                "
                                data-i18n="story.promise.2.t"
                            ></p>
                            <p
                                style="color: var(--ink); font-size: 1.08rem"
                                data-i18n="story.promise.2"
                            ></p>
                        </li>
                        <li class="reveal">
                            <p
                                style="
                                    color: var(--ink);
                                    font-weight: bold;
                                    font-size: 1.2rem;
                                "
                                data-i18n="story.promise.3.t"
                            ></p>
                            <p
                                style="color: var(--ink); font-size: 1.08rem"
                                data-i18n="story.promise.3"
                            ></p>
                        </li>
                    </ol>
                </div>
            </section>

            <section
                class="section"
                style="background: var(--matcha); color: var(--ivory)"
            >
                <div class="wrap center">
                    <p
                        class="pullquote reveal"
                        style="color: var(--ivory)"
                        data-i18n="story.quote"
                    ></p>
                    <p
                        class="reveal"
                        style="
                            font-family: var(--arabic-brand);
                            font-size: 2.4rem;
                            color: var(--matcha-soft);
                            margin: 18px 0 0;
                        "
                    >
                        رملة
                    </p>
                </div>
            </section>

            <section class="section">
                <div class="wrap split">
                    <div class="frame ratio-45 reveal">
                        <img
                            src="/img/street.webp"
                            alt="Thank you for being part of our matcha community"
                            loading="lazy"
                            style="object-position: 30% 50%"
                        />
                    </div>
                    <div class="center">
                        <img
                            class="logo-img"
                            src="/img/logo.png"
                            alt="Ramla رملة Matcha"
                            style="
                                margin-bottom: 32px;
                                margin-inline: auto;
                                height: 70px;
                            "
                        />
                        <div class="reveal">
                            <a
                                class="btn"
                                href="/shop"
                                data-i18n="story.cta"
                            ></a>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <div id="site-footer"></div>
        <script src="/js/i18n.js"></script>
        <script src="/js/app.js"></script>
    </body>
</html>
