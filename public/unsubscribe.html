<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>Unsubscribe — Ramla رملة Matcha</title>
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#EFE9DD" />
        <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Courier+Prime&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,100;1,9..144,300..600,100&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap"
        />
        <link rel="stylesheet" href="/css/style.css" />
        <script>
            // La langue du lien reçu par e-mail (…&l=ar) est appliquée avant l'affichage.
            try {
                const l = new URLSearchParams(location.search).get("l");
                if (l === "ar" || l === "en")
                    localStorage.setItem("ramla_lang", JSON.stringify(l));
            } catch {}
        </script>
    </head>
    <body data-page="thanks">
        <div id="site-header"></div>
        <main class="thanks">
            <div style="max-width: 520px">
                <h1 id="u-title" data-i18n="unsub.title"></h1>
                <p
                    class="muted"
                    id="u-text"
                    style="margin: 14px 0 28px"
                    data-i18n="unsub.text"
                ></p>
                <button class="btn" id="u-btn" data-i18n="unsub.btn"></button>
                <p style="margin-top: 22px">
                    <a class="link-arrow" href="/" data-i18n="ty.cta"></a>
                </p>
            </div>
        </main>
        <div id="site-footer"></div>
        <script src="/js/i18n.js"></script>
        <script src="/js/app.js"></script>
        <script>
            (function () {
                const R = window.Ramla;
                const q = new URLSearchParams(location.search);
                const btn = document.getElementById("u-btn");
                const show = (title, text) => {
                    const t = document.getElementById("u-title"),
                        p = document.getElementById("u-text");
                    t.dataset.i18n = title;
                    p.dataset.i18n = text;
                    t.innerHTML = R.t(title);
                    p.innerHTML = R.t(text);
                    btn.hidden = true;
                };
                if (!q.get("e") || !q.get("t")) {
                    show("unsub.badTitle", "unsub.badText");
                    return;
                }
                btn.addEventListener("click", async () => {
                    btn.disabled = true;
                    try {
                        const r = await fetch("/api/unsubscribe", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                e: q.get("e"),
                                t: q.get("t"),
                            }),
                        });
                        if (!r.ok) throw new Error();
                        show("unsub.okTitle", "unsub.okText");
                    } catch {
                        show("unsub.badTitle", "unsub.badText");
                    }
                });
            })();
        </script>
    </body>
</html>
