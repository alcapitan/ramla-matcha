<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>Ceremonial Matcha 30g — Ramla رملة Matcha</title>
        <meta
            name="description"
            content="Ceremonial grade matcha in a stainless steel tin. 5 000 DA, cash on delivery in 58 wilayas."
        />
        <meta name="theme-color" content="#EFE9DD" />
        <meta property="og:image" content="/img/tin-white.webp" />
        <link rel="icon" href="/img/logo.png" type="image/png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Courier+Prime&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,100;1,9..144,300..600,100&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap"
        />
        <link rel="stylesheet" href="/css/style.css" />
    </head>
    <body data-page="shop">
        <div id="site-header"></div>

        <main>
            <section class="wrap pdp">
                <div>
                    <div class="gallery-main" id="gallery">
                        <button class="gallery-nav prev" aria-label="Previous">
                            <svg
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                            >
                                <path d="M15 6l-6 6 6 6" />
                            </svg>
                        </button>
                        <button class="gallery-nav next" aria-label="Next">
                            <svg
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                            >
                                <path d="M9 6l6 6-6 6" />
                            </svg>
                        </button>
                        <div class="gallery-dots"></div>
                    </div>
                    <div class="thumbs" id="thumbs"></div>
                </div>

                <div class="pdp-info">
                    <span class="eyebrow" data-i18n="shop.eyebrow"></span>
                    <h1 data-pname="matcha-30g">Ceremonial Matcha — 30g</h1>
                    <span class="price" data-price="matcha-30g"></span>
                    <p class="muted" data-i18n="shop.intro"></p>
                    <div class="badges">
                        <span data-i18n="shop.badge1"></span>
                    </div>
                    <div class="qty-add">
                        <div class="qty" role="group" data-i18n-aria="shop.qty">
                            <button type="button" data-step="-1" aria-label="−">
                                −
                            </button>
                            <input
                                id="qty"
                                type="number"
                                inputmode="numeric"
                                min="1"
                                max="50"
                                value="1"
                                aria-label="Quantity"
                            />
                            <button type="button" data-step="1" aria-label="+">
                                +
                            </button>
                        </div>
                        <button
                            class="btn"
                            id="add"
                            data-i18n="btn.add"
                        ></button>
                    </div>
                    <div class="cod-note">
                        <span>💵</span><span data-i18n="shop.cod"></span>
                    </div>

                    <div class="accordion">
                        <details open>
                            <summary data-i18n="shop.d1.t"></summary>
                            <div class="content" data-i18n="shop.d1.c"></div>
                        </details>
                        <details>
                            <summary data-i18n="shop.d2.t"></summary>
                            <div class="content" data-i18n="shop.d2.c"></div>
                        </details>
                        <details>
                            <summary data-i18n="shop.d3.t"></summary>
                            <div class="content" data-i18n="shop.d3.c"></div>
                        </details>
                        <details>
                            <summary data-i18n="shop.d4.t"></summary>
                            <div class="content" data-i18n="shop.d4.c"></div>
                        </details>
                    </div>
                </div>
            </section>

            <section class="section">
                <div class="wrap">
                    <h2
                        class="reveal center"
                        style="margin-bottom: 40px"
                        data-i18n="shop.gallery"
                    ></h2>
                    <div class="mosaic">
                        <div class="frame m1 reveal">
                            <img src="/img/field.jpg" alt="" loading="lazy" />
                        </div>
                        <div class="frame m2 reveal">
                            <img
                                src="/img/matcha-hot.webp"
                                alt=""
                                loading="lazy"
                            />
                        </div>
                        <div class="frame m3 reveal">
                            <img
                                src="/img/tins-stone.jpg"
                                alt=""
                                loading="lazy"
                            />
                        </div>
                        <div class="frame m4 reveal">
                            <img
                                src="/img/machine.jpg"
                                alt="How to make the perfect matcha"
                                loading="lazy"
                            />
                        </div>
                    </div>
                </div>
            </section>

            <section class="section" style="padding-top: 0">
                <div class="wrap">
                    <h2
                        class="reveal"
                        style="margin-bottom: 36px"
                        data-i18n="shop.pair"
                    ></h2>
                    <div class="products" id="pair"></div>
                </div>
            </section>
        </main>

        <div id="site-footer"></div>

        <script src="/js/i18n.js"></script>
        <script src="/js/app.js"></script>
        <script>
            (async function () {
                const R = window.Ramla;
                const p = await R.product("matcha-30g");
                const g = document.getElementById("gallery");
                const thumbs = document.getElementById("thumbs");
                const dots = g.querySelector(".gallery-dots");
                p.gallery.forEach((src, i) => {
                    const img = document.createElement("img");
                    img.src = src;
                    img.alt = R.pname(p);
                    img.decoding = "async";
                    if (i > 1) img.loading = "lazy";
                    g.insertBefore(img, g.querySelector(".gallery-nav"));
                });
                thumbs.innerHTML = p.gallery
                    .map(
                        (src, i) =>
                            `<button aria-label="${i + 1}"><img src="${src}" alt="" loading="lazy"></button>`,
                    )
                    .join("");
                dots.innerHTML = p.gallery.map(() => "<span></span>").join("");
                const imgs = [...g.querySelectorAll("img")];
                let idx = 0;
                function show(i) {
                    idx = (i + imgs.length) % imgs.length;
                    imgs.forEach((im, k) =>
                        im.classList.toggle("active", k === idx),
                    );
                    [...thumbs.children].forEach((b, k) =>
                        b.setAttribute("aria-current", String(k === idx)),
                    );
                    [...dots.children].forEach((d, k) =>
                        d.classList.toggle("active", k === idx),
                    );
                }
                const rtl = () => document.documentElement.dir === "rtl";
                g.querySelector(".prev").onclick = () => show(idx - 1);
                g.querySelector(".next").onclick = () => show(idx + 1);
                [...thumbs.children].forEach(
                    (b, k) => (b.onclick = () => show(k)),
                );
                let x0 = null;
                g.addEventListener(
                    "touchstart",
                    (e) => (x0 = e.touches[0].clientX),
                    { passive: true },
                );
                g.addEventListener("touchend", (e) => {
                    if (x0 == null) return;
                    const dx = e.changedTouches[0].clientX - x0;
                    x0 = null;
                    if (Math.abs(dx) > 40)
                        show(idx + (dx < 0 !== rtl() ? 1 : -1));
                });
                show(0);

                const qty = document.getElementById("qty");
                const clamp = () =>
                    (qty.value = Math.max(
                        1,
                        Math.min(50, parseInt(qty.value, 10) || 1),
                    ));
                document.querySelectorAll("[data-step]").forEach((b) =>
                    b.addEventListener("click", () => {
                        qty.value =
                            (parseInt(qty.value, 10) || 1) +
                            Number(b.dataset.step);
                        clamp();
                    }),
                );
                qty.addEventListener("change", clamp);
                document
                    .getElementById("add")
                    .addEventListener("click", (e) => {
                        clamp();
                        R.cart.add("matcha-30g", Number(qty.value));
                        const b = e.currentTarget;
                        b.textContent = R.t("btn.added");
                        setTimeout(
                            () => (b.textContent = R.t("btn.add")),
                            1600,
                        );
                    });

                async function pair() {
                    const shop = await R.shop();
                    document.getElementById("pair").innerHTML = shop.products
                        .filter((x) => x.id !== "matcha-30g")
                        .map(R.productCard)
                        .join("");
                    R.observe();
                }
                pair();
                R.refreshProductNames();
                document.addEventListener("langchange", pair);
            })();
        </script>
    </body>
</html>
